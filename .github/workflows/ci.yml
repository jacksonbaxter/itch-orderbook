# This workflow runs on GitHub for every push and pull request. Its first run, at 2810183,
# failed three jobs, and none of them had got as far as the tests: both GCC jobs at Build,
# on a -Wconversion error that only Linux's 64-bit uint_fast32_t shows, and the x86-64
# Clang job at the LLVM fetch, whose 1 GiB zstd window tar's zstd refused. The run at
# da1a707 was the first with every job green. NOTES.md, "CI's first runs on GitHub".
#
# Each job builds the release preset and runs all of ctest on its own compiler:
#   x86-64 Linux, GCC     g++ 14 from Ubuntu 24.04.
#   x86-64 Linux, Clang   Clang 23.1.4, the release the repo is tested on, on libstdc++.
#   arm64 Linux, GCC      g++ 14, where char is unsigned.
#   arm64 macOS, Clang    Clang 23.1.4 on the macOS SDK.
#   Emscripten            Emscripten 6.0.13, the parser library and its smoke test, and the
#                         demo's engine, itch_demo, with its smoke test in node.
#
# scripts/check.sh runs actionlint over this file locally. The sanitizers, clang-tidy, the
# fuzz smoke runs and the fault matrix run there, not here.
#
# CI calls presets only, and produces no benchmark numbers. It needs nothing from data/.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 Linux, GCC
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            llvm: false
          - name: x86-64 Linux, Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            llvm: true
          - name: arm64 Linux, GCC
            os: ubuntu-24.04-arm
            cc: gcc-14
            cxx: g++-14
            llvm: false
          - name: arm64 macOS, Clang
            os: macos-15
            cc: clang
            cxx: clang++
            llvm: true
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GCC and Ninja
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build zstd
      - name: Install Ninja and point at the SDK
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Fetch the pinned LLVM
        if: matrix.llvm
        run: python3 -B scripts/fetch_tool.py llvm >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
      # ctest prints no output for a test that passes, so this shows which kernels the
      # runner's CPU ran and which it skipped, and the CPU features that decided it.
      - name: The kernels this CPU ran or skipped
        run: |
          if [ -r /proc/cpuinfo ]; then
            grep -m 1 -E '^(model name|CPU part)' /proc/cpuinfo || echo "cpu: no model in /proc/cpuinfo"
            for flag in ssse3 avx2 avx512f avx512bw avx512vl avx512vbmi; do
              if grep -q -m 1 -w "$flag" /proc/cpuinfo; then echo "cpu has $flag"; else echo "cpu lacks $flag"; fi
            done
          else
            sysctl -n machdep.cpu.brand_string
          fi
          ctest --preset release -R '^test_kernels_' --verbose

  wasm:
    name: Emscripten
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: 35659964bc2762fffec0d257997fb61475f765b7 # 6.0.13
          path: build/_tools/emsdk
          persist-credentials: false
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Install Emscripten
        working-directory: build/_tools/emsdk
        run: |
          ./emsdk install 6.0.13
          ./emsdk activate 6.0.13
      - name: Configure, build and test
        run: |
          source build/_tools/emsdk/emsdk_env.sh
          cmake --preset wasm
          cmake --build --preset wasm
          ctest --preset wasm
